name: ShellCheck

on:
  push:
    paths:
      - "scripts/bash/**"
  pull_request:
    paths:
      - "scripts/bash/**"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts/bash
